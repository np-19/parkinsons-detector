services:
  backend-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: parkinsons-detector-backend:latest
    container_name: parkinsons-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    shm_size: '4gb'
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/workspace
      - DEVICE=cuda
      - HF_HOME=/workspace/.cache/huggingface
      - TORCH_HOME=/workspace/.cache/torch
    volumes:
      - ./artifacts:/workspace/artifacts:ro
      - ./src:/workspace/src:ro
      - ./backend:/workspace/backend
      - huggingface-cache:/workspace/.cache/huggingface
    networks:
      default:
        aliases:
          - backend
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend-cpu:
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: parkinsons-detector-backend:latest
    container_name: parkinsons-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    shm_size: '4gb'
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/workspace
      - DEVICE=cpu
      - HF_HOME=/workspace/.cache/huggingface
      - TORCH_HOME=/workspace/.cache/torch
    volumes:
      - ./artifacts:/workspace/artifacts:ro
      - ./src:/workspace/src:ro
      - ./backend:/workspace/backend
      - huggingface-cache:/workspace/.cache/huggingface
    networks:
      default:
        aliases:
          - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: parkinsons-detector-frontend:latest
    container_name: parkinsons-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro

volumes:
  huggingface-cache:
